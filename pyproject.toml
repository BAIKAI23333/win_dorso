[project]
name = "windorso"
version = "0.1.0"
description = "Windows posture monitor that dims the screen when you slouch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["posture", "webcam", "mediapipe", "health", "ergonomics"]
dependencies = [
    "mediapipe==0.10.18",
    "opencv-python>=4.11",
    "PyQt6>=6.11",
    "numpy>=2.4",
]

[project.urls]
Homepage = "https://github.com/BAIKAI23333/win_dorso"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "main",
    "main_window",
    "posture_detector",
    "blur_overlay",
    "calibration",
    "config",
    "i18n",
]
